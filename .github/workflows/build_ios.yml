name: Build iOS IPA

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên giao diện GitHub Actions
  push:
    branches:
      - main
      - master
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14 # Máy Mac M1/M2 của GitHub Cloud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: |
          flutter --version
          pod --version

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y mommy_baby.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mommy-baby-ios-ipa
          path: mommy_baby.ipa
          retention-days: 14
